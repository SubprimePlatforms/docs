  /v1/aml/transactions:
    post:
      tags:
        - AML
      summary: Save transaction records for monitoring
      description: 'Stores one or more transactions for AML transaction-risk
        monitoring. Send a JSON array or `{ "transactions": [ ... ] }` — up to
        500 records or 5 MB per request, whichever is smaller. Ingest is
        idempotent on `clientTxnId`: re-posting the same id updates the same
        record and appends a revision entry only when a field really changed.
        Subjects are auto-provisioned and enrolled in monitoring on first sight;
        a counterparty is stored as a data field and is never enrolled. A
        well-formed envelope ALWAYS returns 200 — per-record outcomes are data,
        so always inspect `results` for `warnings` and `errors`. Both snake_case
        and camelCase request keys are accepted; `metadata` keys are never
        converted.'
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmlTransactionBatch"
      responses:
        "200":
          description: Per-record results. Inspect `results` — a stored record may still
            carry warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlIngestResponse"
        "400":
          description: The request body failed schema validation or contained an
            unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API key is missing, or the referenced resource does not belong to
            this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request body exceeded 5 MB. Split the batch into smaller requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Monthly transaction quota exceeded. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmlQuotaExceeded"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
