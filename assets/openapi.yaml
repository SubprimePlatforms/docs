        matched_session_id:
          type: string
        message:
          type: string
      required:
        - face_attached
        - document_number
    SelfExclusionApplicantRequest:
      type: object
      properties:
        session_id:
          type: string
          minLength: 1
        reason:
          type: string
      required:
        - session_id
      description: "Exclude an applicant by session: flags the face (with
        matched-session fallback) and, if the session has a scanned document
        number, adds an identity exclusion linked to that face."
    AmlIngestResponse:
      type: object
      properties:
        accepted:
          type: integer
          description: Records STORED — clean and warned. `warned` is an informational
            subset of this.
        warned:
          type: integer
        rejected:
          type: integer
          description: Records that were not stored.
        results:
          type: array
          items:
            $ref: "#/components/schemas/AmlRecordResult"
      required:
        - accepted
        - warned
        - rejected
        - results
      description: A well-formed envelope always returns 200. Per-record outcomes are
        DATA, not transport errors — always inspect `results`.
    AmlRecordResult:
      type: object
      properties:
        index:
          type: integer
          description: Zero-based position in the submitted batch.
        client_txn_id:
          type:
            - string
            - "null"
        status:
          type: string
          enum:
            - accepted
            - warned
            - rejected
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              field:
                type:
                  - string
                  - "null"
                description: Dotted path to the offending field, in snake_case.
                example: amount.value
              message:
                type: string
            required:
              - code
              - field
              - message
      required:
        - index
        - client_txn_id
        - status
    AmlQuotaExceeded:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum:
            - QUOTA_EXCEEDED
        quota:
          type: integer
        used:
          type: integer
        remaining:
          type: integer
        month:
          type: string
          example: 2026-08
        resets_at:
          type: string
          example: 2026-09-01T00:00:00.000Z
      required:
        - error
        - code
        - quota
        - used
        - remaining
        - month
        - resets_at
      description: Nothing was stored. Reservation is atomic and happens before any write.
    AmlTransactionBatch:
      type: object
      properties:
        bot_id:
          type: string
          minLength: 1
          description: Enrol subjects into this specific transaction_risk bot. Omit it
            when the organization has exactly one running transaction_risk bot;
            we never auto-select among several.
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/AmlTransactionRecord"
          minItems: 1
          maxItems: 500
      required:
        - transactions
      description: Up to 500 records or 5 MB per request, whichever is smaller. A bare
        JSON array of records is also accepted. Both snake_case and camelCase
        keys are accepted; `metadata` keys are never converted.
    AmlTransactionRecord:
      type: object
      properties:
        client_txn_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Your own unique identifier for this transaction. Re-posting the
            same id updates the same record — this is what makes ingest
            idempotent. Max 128 characters.
          example: txn-000123
        subject_user_id:
          type: string
          minLength: 1
          description: Your own identifier for the customer this transaction belongs to. A
            subject is auto-provisioned and enrolled in monitoring on first
            sight.
          example: cust-8821
        timestamp:
          type: string
          description: When the transaction occurred (ISO-8601).
          example: 2026-08-01T09:00:00Z
        direction:
          type: string
          enum:
            - inbound
            - outbound
            - internal
        amount:
          $ref: "#/components/schemas/AmlAmount"
        type:
          type: string
          enum:
            - card
            - wire
            - eft
            - ach
            - crypto
            - cash
            - internal_transfer
            - other
        normalized_amount:
          $ref: "#/components/schemas/AmlNormalizedAmount"
        fx_rate:
          type: number
        status:
          type: string
          enum:
            - pending
            - completed
            - failed
            - reversed
        channel:
          type: string
          enum:
            - web
            - mobile
            - api
            - branch
            - atm
            - pos
        counterparty:
          type: object
          properties:
            name:
              type: string
            external_id:
              type: string
            account_number:
              type: string
            institution:
              type: string
            country:
              type: string
              description: ISO-3166-1 alpha-2 country code.
              example: CA
            wallet_address:
              type: string
          description: The other party to the transaction. Stored as a data field for rule
            evaluation — a counterparty is NEVER enrolled as a monitored user.
        geography:
          type: object
          properties:
            origin_country:
              type: string
              description: ISO-3166-1 alpha-2 country code.
              example: CA
            destination_country:
              type: string
              description: ISO-3166-1 alpha-2 country code.
              example: CA
            ip_country:
              type: string
              description: ISO-3166-1 alpha-2 country code.
              example: CA
            ip_address:
              type: string
              description: Optional. The IP address the transaction originated from. Retained
                as context for risk adjudication — it does NOT trigger any rule.
              example: 203.0.113.42
        crypto:
          type: object
          properties:
            asset_type:
              type: string
            tx_hash:
              type: string
            wallet_from:
              type: string
            wallet_to:
              type: string
            amount_asset:
              type: number
        metadata:
          type: object
          additionalProperties: {}
          description: Free-form client-specific fields. Stored verbatim and never
            interpreted — your keys are preserved exactly as sent and are NOT
            case-converted.
        subject:
          type: object
          properties:
            first_name:
              type:
                - string
                - "null"
            last_name:
              type:
                - string
                - "null"
            email:
              type:
                - string
                - "null"
              format: email
            phone:
              type:
                - string
                - "null"
          description: Optional identity for the subject. Omitting it still stores the
            transaction and monitors the subject, but an unnamed subject cannot
            be name-screened (you receive a SUBJECT_UNNAMED warning).
      required:
        - client_txn_id
        - subject_user_id
        - timestamp
        - direction
        - amount
        - type
    AmlAmount:
      type: object
      properties:
        value:
          type: number
        currency:
          type: string
          description: ISO-4217 currency code. Retired codes are accepted.
          example: USD
      required:
        - value
        - currency
      description: A monetary figure. `value` must be a JSON number, not a string.
    AmlNormalizedAmount:
      type: object
      properties:
        value:
          type: number
        currency:
          type: string
          description: ISO-4217 currency code. Retired codes are accepted.
          example: USD
        fx_rate:
          type: number
      required:
        - value
        - currency
      description: The amount expressed in your organization's base currency. Supply
        it whenever the transaction currency differs from your base currency —
        we perform no FX conversion.
    MonitoredUser:
      type: object
      properties:
        org_id:
          type: string
        bot_id:
          type: string
        subject_user_id:
          type: string
        subject_user_name:
          type:
            - string
            - "null"
        subject_country:
          type: string
        status:
          type: string
        cadence_days:
          type: number
        next_check_at:
          type: string
        last_checked_at:
          type:
            - string
            - "null"
        added_at:
          type: string
        added_by:
          type:
            - string
            - "null"
        updated_at:
          type: string
      required:
        - org_id
        - bot_id
        - subject_user_id
        - subject_user_name
        - subject_country
        - status
        - cadence_days
        - next_check_at
        - last_checked_at
        - added_at
        - added_by
        - updated_at
    AddMonitoredUserRequest:
      type: object
      properties:
        subject_user_id:
          type: string
          minLength: 1
          description: Your own identifier for the customer to place under monitoring.
          example: cust-8821
      required:
        - subject_user_id
      description: Both snake_case and camelCase keys are accepted at runtime.
  parameters: {}
paths:
  /v1/document/scan:
    post:
      tags:
        - Document
      summary: Scan an identity document
      description: Extracts structured identity data (name, date of birth, document
        number, etc.) from a single document image via AWS Textract AnalyzeID.
        Accepts the image as a multipart upload, a base64/base64url-encoded JSON
        string, or an S3 object key from a previously presigned upload.
      security: &a2
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanDocumentJsonRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ScanDocumentMultipartRequest"
      responses:
        "200":
          description: Successful scan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanDocumentResponse"
        "400":
          description: The request body failed schema validation or contained an
            unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API key is missing, or the referenced resource does not belong to
            this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/face/detect:
    post:
      tags:
        - Face
      summary: Detect a face in an image
      description: "Returns the highest-confidence detected face with its bounding box
        and facial landmarks. When no face is detected, returns `faceDetected:
        false` with `confidence: 0`."
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectFaceJsonRequest"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DetectFaceMultipartRequest"
      responses:
        "200":
          description: Detection result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectFaceResponse"
        "400":
          description: The request body failed schema validation or contained an
            unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
          content:
            application/json:
              schema:
