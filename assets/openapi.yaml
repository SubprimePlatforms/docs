  /v1/sessions/{session_id}/workflow/start:
    post:
      tags:
        - Workflows
      summary: Start an existing workflow session
      description: "Hands an un-started headless workflow session to an SDK runner:
        create the session with `POST /v1/workflows/{workflow_id}/sessions` from
        your backend, then pass only the `session_id` to the app, which starts
        the run here. Validate-only — the call never writes, so it is safely
        repeatable until the first step submission lands. The session must be
        `PENDING` and un-started (`session_progress: PENDING`); already-started,
        terminal, and expired sessions return 409. Sessions without
        `workflowExecution` (hosted / invite-lane) return 404. The 200 body is
        the same execution-state envelope as `GET
        /v1/sessions/{session_id}/workflow`."
      security: *a2
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: session_id
          in: path
      responses:
        "200":
          description: Session is runnable. Returns the current workflow execution state —
            identical shape to the GET.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSessionWorkflowResponse"
        "400":
          description: Invalid `session_id`, or the session's snapshotted execution plan
            contains steps this runner does not support (`invalid_steps` lists
            them in API form).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API key is missing, or the referenced resource does not belong to
