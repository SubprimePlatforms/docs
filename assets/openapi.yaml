            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Session is not `PENDING` / un-started — already started, terminal,
            or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/sessions/{session_id}/steps/{step_id}:
    post:
      tags:
        - Workflows
      summary: Submit a workflow session step
      description: "Submits and executes a single step of a headless workflow session.
        `step_id` is case- and separator-insensitive (ID_VERIFICATION,
        id_verification and id-verification all resolve) and must be the current
        step of the session's workflow. The body is validated against the step's
        stored config (required upload slots vary per workflow). FACE_LIVENESS
        is two-phase via `action: start | complete`. Steps must be submitted in
        order; out-of-order or terminal-session submissions return 409. No
        inline billing — the completed session is stream-billed downstream."
      security: *a2
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: session_id
          in: path
        - schema:
            type: string
            enum:
              - ID_VERIFICATION
              - FACE_LIVENESS
            example: ID_VERIFICATION
            description: "Runnable workflow step id. Case- and separator-insensitive:
              `id_verification` and `id-verification` resolve to the same step."
          required: true
          description: "Runnable workflow step id. Case- and separator-insensitive:
            `id_verification` and `id-verification` resolve to the same step."
          name: step_id
          in: path
