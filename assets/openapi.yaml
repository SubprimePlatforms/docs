  /v1/face/liveness/sessions:
    post:
      tags:
        - Face
      summary: Create a face liveness session and vend streaming credentials
      description: Creates an AWS Rekognition Face Liveness session and returns
        short-lived STS credentials scoped to only
        `rekognition:StartFaceLivenessSession`, which the device uses to open
        the liveness streaming connection. Pass `session_id` to attach the check
        to a verification session (billed as part of that session); omit it to
        run standalone (billed per use). Reference and audit images are never
        persisted or returned.
      security: *a2
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLivenessSessionRequest"
      responses:
        "200":
          description: Liveness session created with vended credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLivenessSessionResponse"
        "400":
          description: The request body failed schema validation or contained an
            unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "402":
          description: Organization has insufficient credits and is not subscribed to the
            IDV service (standalone checks only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: API key is missing, or the referenced resource does not belong to
            this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referenced resource was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/face/liveness/sessions/{liveness_session_id}/result:
    get:
      tags:
        - Face
      summary: Fetch a face liveness result
      description: Returns the normalized liveness status, confidence, and a
        server-computed `passed` flag (confidence compared against an
        overridable threshold, default 80). Reference and audit images are never
        returned. Pass `session_id` to authorize the read against the owning
        verification session.
      security: *a2
      parameters:
        - schema:
            type: string
            description: The Rekognition liveness session id returned at create time.
          required: true
          description: The Rekognition liveness session id returned at create time.
          name: liveness_session_id
          in: path
        - schema:
            type: string
            description: Optional verification session the liveness check was attached to.
              When provided, ownership is enforced against it.
          required: false
          description: Optional verification session the liveness check was attached to.
            When provided, ownership is enforced against it.
          name: session_id
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            description: Pass/fail cutoff for `passed`, 1-100. Defaults to 80 when omitted.
              SDK-overridable.
          required: false
          description: Pass/fail cutoff for `passed`, 1-100. Defaults to 80 when omitted.
            SDK-overridable.
          name: confidence_threshold
          in: query
      responses:
        "200":
          description: Liveness result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResultResponse"
        "400":
          description: The request body failed schema validation or contained an
            unsupported image format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API key is invalid.
